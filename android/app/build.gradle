plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.mylinxi.showerredemption'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.github.mylinxi.showerredemption'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Align the Kotlin runtime pulled in by the AndroidX libraries.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    // ZXing uses AndroidX for camera permission checks and scan intents at runtime.
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
