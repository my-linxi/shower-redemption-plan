name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build and lint Android app
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify APK signature
        run: |
          apk="$RUNNER_TEMP/shower-redemption-plan.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: shower-redemption-plan-apk
          path: ${{ runner.temp }}/shower-redemption-plan.apk
          if-no-files-found: error
